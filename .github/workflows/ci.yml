# Tests on every push and pull request. Deployment is not done here: the
# Upsun GitHub integration builds and deploys every push, and gives every pull
# request its own environment (see README, "Manual setup").
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Upsun config and shared code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Messaging code is identical in the three apps
        run: bin/sync-messaging.sh --check
      - name: Install the Upsun CLI
        run: curl -fsSL https://raw.githubusercontent.com/upsun/cli/main/installer.sh | bash
      - name: Validate .upsun/config.yaml
        run: upsun app:config-validate

  test:
    name: Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [nfw, oms, promotions]
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: aurora_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      # Same engine as on Upsun; phpunit.xml falls back to SQLite when these are not set.
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: aurora_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: rdkafka, redis, pdo_mysql, pcntl, posix, intl, bcmath
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/composer.lock', matrix.app)) }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Front-end build (NFW only)
        if: matrix.app == 'nfw'
        run: npm ci && npm run build

      - run: cp .env.example .env && php artisan key:generate

      - run: php artisan test
